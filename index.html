<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#070d1f" id="metaThemeColor" />
<title>Untitled — Kanban</title>
<style>
:root{
  --bg-grad:radial-gradient(1200px 800px at 20% -10%,#0e1a4a 0%,transparent 60%),radial-gradient(900px 600px at 110% 10%,#122466 0%,transparent 55%),linear-gradient(180deg,#04081a,#070d23);
  --ink:#dbe7ff;--ink-strong:#eaf2ff;--ink-dim:#8aa0d0;--accent:#4aa3ff;--accent-2:#7ec0ff;--danger:#ff7a8a;--warn:#ffb86b;--link:#9be4a0;
  --panel-1:#0c1740;--panel-2:#070d28;--panel-3:#050a20;--card-1:#122152;--card-2:#0b1438;--tool-1:#122152;--tool-2:#0b1438;--modal-1:#0e1a4a;--modal-2:#070d28;
  --input-bg:rgba(255,255,255,.04);--input-border:rgba(160,190,255,.18);--hint:rgba(255,255,255,.05);
  --shadow-strong:0 30px 60px -20px rgba(0,0,0,.7),0 10px 30px -10px rgba(10,20,60,.8);--shadow-card:0 14px 24px -14px rgba(0,0,0,.7),0 6px 14px -8px rgba(10,20,60,.7);
  --rim-inset:inset 0 1px 0 rgba(160,200,255,.55),inset 0 -1px 0 rgba(20,40,90,.85),inset 0 0 0 1px rgba(120,160,230,.08);
  --rim-inset-card:inset 0 1px 0 rgba(170,200,255,.35),inset 0 -1px 0 rgba(20,40,90,.9),inset 0 0 0 1px rgba(120,160,230,.08);
  --meta-theme:#070d1f;
  --accent-soft-08:color-mix(in srgb,var(--accent) 8%,transparent);--accent-soft-12:color-mix(in srgb,var(--accent) 12%,transparent);--accent-soft-18:color-mix(in srgb,var(--accent) 18%,transparent);--accent-edge-45:color-mix(in srgb,var(--accent) 45%,transparent);
}
*{box-sizing:border-box}html,body{height:100%;overscroll-behavior:none}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;font-weight:200;color:var(--ink);background:var(--panel-3);overflow:hidden}body:before{content:"";position:fixed;inset:0;z-index:0;background:var(--bg-grad);background-size:cover}
.app{position:relative;z-index:1;height:100vh;display:grid;grid-template-rows:auto auto 1fr;gap:14px;padding:14px}
.toolbar{display:grid;grid-template-columns:56px minmax(0,3fr) minmax(230px,1fr) 56px;gap:14px}
.tool{position:relative;border-radius:18px;min-height:56px;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,0) 45%),linear-gradient(180deg,var(--tool-1),var(--tool-2));color:var(--ink-strong);box-shadow:var(--shadow-card),var(--rim-inset);user-select:none}
.tool:hover{transform:translateY(-1px)}.tool:active{transform:translateY(0) scale(.99)}
.site-icon{cursor:pointer;overflow:visible}.site-icon img{width:100%;height:100%;padding:9px;object-fit:contain;display:none}.site-icon.has-icon img{display:block}.site-icon.has-icon #siteIconPlaceholder{display:none}
.site-icon-remove{position:absolute;top:-7px;right:-7px;width:18px;height:18px;border-radius:50%;border:0;background:var(--danger);color:#fff;display:none;align-items:center;justify-content:center;cursor:pointer;font-size:13px}
.site-icon.has-icon:hover .site-icon-remove{display:flex}
.title-input{width:100%;height:100%;background:transparent;border:0;outline:0;color:var(--ink-strong);font:200 16px Inter,system-ui,sans-serif;text-align:center;letter-spacing:1px;padding:14px 18px}
.saved-dot{position:absolute;top:10px;right:14px;width:7px;height:7px;border-radius:50%;background:#9be4a0;opacity:0;transition:.25s}.saved-dot.dirty,.saved-dot.show{opacity:1}.saved-dot.dirty{background:#ffb86b}
.menu-toggle{cursor:pointer}
.pomo{padding:7px 10px;cursor:pointer;overflow:hidden}
.pomo-fill{position:absolute;left:0;top:0;bottom:0;width:0%;background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--accent) 14%,transparent));pointer-events:none}
.pomo-inner{width:100%;height:42px;border-radius:13px;border:1px solid var(--input-border);background:rgba(255,255,255,.035);display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;padding:6px 10px}
.pomo-ticks{height:28px;display:flex;align-items:center;justify-content:space-between;gap:3px;min-width:0}
.pomo-tick{width:2px;height:12px;border-radius:999px;background:var(--ink-dim);opacity:.38;transition:.15s}
.pomo-tick.major{height:26px;width:3px;opacity:.72}
.pomo-tick.active{background:var(--accent-2);opacity:1;box-shadow:0 0 8px var(--accent)}
.pomo-state{font-size:13px;min-width:72px;text-align:right;color:var(--ink-strong);letter-spacing:.8px;white-space:nowrap}
.pomo.running{cursor:ew-resize}
.pomo.running .pomo-inner{border-color:var(--accent);box-shadow:0 0 22px color-mix(in srgb,var(--accent) 22%,transparent)}
.pomo.ringing .pomo-inner{border-color:var(--danger);box-shadow:0 0 24px color-mix(in srgb,var(--danger) 28%,transparent)}
.pomo.ringing .pomo-state{color:var(--danger);letter-spacing:1.3px;font-size:11px}
.boards-bar{display:flex;gap:8px;align-items:center;padding:6px;border-radius:18px;background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,0) 45%),linear-gradient(180deg,var(--panel-1),var(--panel-2));box-shadow:var(--shadow-card),var(--rim-inset);overflow:hidden}
.boards-tabs{display:flex;align-items:stretch;gap:0;overflow-x:auto;overflow-y:hidden;flex:1;padding:2px;scrollbar-width:thin}
.board-tab{position:relative;flex-shrink:0;padding:9px 12px 9px 14px;border-radius:12px;background:linear-gradient(180deg,var(--card-1),var(--card-2));color:var(--ink);cursor:pointer;display:flex;align-items:center;gap:8px;font-size:13px;white-space:nowrap;box-shadow:var(--shadow-card),var(--rim-inset-card);transition:.15s}
.board-tab:hover{transform:translateY(-1px)}
.board-tab.active{background:linear-gradient(180deg,var(--accent),var(--accent-2));color:#fff}
.board-tab-name{outline:none;max-width:200px;overflow:hidden;text-overflow:ellipsis}
.board-tab-name[contenteditable=true]{background:rgba(255,255,255,.12);padding:0 4px;border-radius:4px}
.board-tab-close{width:18px;height:18px;border-radius:50%;border:0;background:transparent;color:inherit;opacity:.55;cursor:pointer}
.board-tab-close:hover{opacity:1;background:rgba(255,255,255,.18)}
.board-gap{flex:0 0 8px;align-self:stretch;cursor:context-menu;border-radius:6px;transition:background .12s}
.board-gap:hover{background:var(--accent-soft-08)}
.board-add{flex-shrink:0;width:40px;height:40px;border-radius:12px;background:transparent;border:1px dashed var(--input-border);color:var(--ink-dim);cursor:pointer;font-size:18px}
.board-add:hover{border-color:var(--accent);background:var(--accent-soft-08);color:var(--ink-strong)}
.board{display:flex;gap:0;min-height:0;overflow-x:auto;overflow-y:hidden;padding-bottom:4px}
.board::-webkit-scrollbar,.boards-tabs::-webkit-scrollbar{height:8px}
.board::-webkit-scrollbar-thumb,.boards-tabs::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--accent) 20%,transparent);border-radius:8px}
.column{position:relative;border-radius:26px;padding:18px 14px 14px;display:flex;flex-direction:column;min-height:0;flex:0 0 max(260px,calc((100% - 90px)/4));max-width:max(260px,calc((100% - 90px)/4));background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,0) 35%),linear-gradient(180deg,var(--panel-1) 0%,var(--panel-2) 55%,var(--panel-3) 100%);box-shadow:var(--shadow-strong),var(--rim-inset);overflow:hidden;isolation:isolate}
.column.col-dragging{opacity:.45}
.column.col-drop-target{outline:2px solid var(--accent-edge-45)}
.col-gap{flex:0 0 8px;align-self:stretch;cursor:context-menu;border-radius:6px;transition:background .12s;min-width:8px}
.col-gap:hover{background:var(--accent-soft-08)}
.col-head{display:flex;align-items:center;gap:10px;padding:4px 8px 12px;cursor:grab}
.col-title{flex:1;min-width:0;font-size:16px;letter-spacing:3px;text-transform:uppercase;color:var(--ink-strong);outline:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:2px 4px;border-radius:6px}
.col-title[contenteditable=true]{background:var(--accent-soft-08);cursor:text;text-overflow:clip}
.col-count{font-size:12px;color:var(--ink-dim);border:1px solid var(--input-border);padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.02)}
.col-del{width:24px;height:24px;border-radius:50%;background:transparent;border:1px solid var(--input-border);color:var(--ink-dim);cursor:pointer}
.col-del:hover{color:var(--danger);border-color:var(--danger)}
.add-btn{font:200 13px Inter,system-ui,sans-serif;color:var(--ink);background:transparent;border:1px dashed var(--input-border);border-radius:14px;padding:10px 12px;cursor:pointer;width:100%;text-align:left;letter-spacing:1px;margin-bottom:10px}
.add-btn:hover{border-color:var(--accent);background:var(--accent-soft-08)}
.list{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:4px;border-radius:18px}
.card{position:relative;display:flex;align-items:center;gap:8px;padding:12px 12px 12px 14px;border-radius:14px;background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,0) 45%),linear-gradient(180deg,var(--card-1),var(--card-2));color:var(--ink-strong);font-size:15px;cursor:grab;user-select:none;touch-action:none;box-shadow:var(--shadow-card),var(--rim-inset-card)}
.card .text{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.has-desc{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent-2);margin-right:8px;vertical-align:middle;box-shadow:0 0 8px var(--accent-2)}
.icon-btn{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:transparent;border:1px solid var(--input-border);color:var(--ink-dim);cursor:pointer}
.icon-btn:hover{color:var(--ink-strong);border-color:var(--accent)}
.icon-btn.del:hover{color:var(--danger);border-color:var(--danger)}
.icon-btn.link{color:var(--link);border-color:color-mix(in srgb,var(--link) 45%,transparent)}
.drag-ghost{position:fixed;left:0;top:0;z-index:1000;pointer-events:none;will-change:transform;box-shadow:0 28px 50px -16px rgba(0,0,0,.7),var(--rim-inset-card),0 0 30px color-mix(in srgb,var(--accent) 45%,transparent);opacity:.95}
.drag-placeholder{border-radius:14px;background:var(--accent-soft-12);border:1px dashed var(--accent-edge-45);flex-shrink:0}
.card.dragging-source{opacity:0;pointer-events:none}
.modal-back{position:fixed;inset:0;z-index:500;background:rgba(3,6,18,.55);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:20px}
.modal-back.show{display:flex}
.modal{width:min(680px,100%);max-height:88vh;overflow:auto;border-radius:22px;padding:22px;background:linear-gradient(180deg,var(--modal-1),var(--modal-2));box-shadow:0 40px 80px -20px rgba(0,0,0,.5),var(--rim-inset);color:var(--ink)}
.modal.narrow{width:min(360px,100%)}
.modal h3{margin:0 0 6px;font-weight:200;letter-spacing:2px;text-transform:uppercase;font-size:13px;color:var(--ink-dim)}
.modal input,.modal textarea{width:100%;padding:12px 14px;border-radius:12px;margin-top:6px;background:var(--input-bg);border:1px solid var(--input-border);color:var(--ink);font:200 15px Inter,system-ui,sans-serif;outline:none}
.modal textarea{min-height:180px;line-height:1.5;resize:vertical}
.modal-row{display:flex;justify-content:flex-end;gap:10px;margin-top:16px;flex-wrap:wrap}
.modal button,.menu-item{font:200 13px Inter,system-ui,sans-serif;letter-spacing:1px;padding:10px 16px;border-radius:999px;cursor:pointer;background:transparent;color:var(--ink);border:1px solid var(--input-border)}
.modal button.primary{background:linear-gradient(180deg,var(--accent-2),var(--accent));color:#fff;border-color:transparent}
.modal button.danger{color:var(--danger);border-color:var(--danger)}
.desc-view{margin-top:8px;padding:14px 16px;background:var(--input-bg);border:1px solid var(--input-border);border-radius:12px;white-space:pre-wrap;word-wrap:break-word;line-height:1.6}
.view-title{font-size:20px;margin:8px 0 4px;color:var(--ink-strong);word-wrap:break-word}
.view-link{display:inline-flex;gap:8px;margin-top:8px;padding:8px 12px;border-radius:10px;background:color-mix(in srgb,var(--link) 14%,transparent);color:var(--link);text-decoration:none;border:1px solid color-mix(in srgb,var(--link) 45%,transparent);font-size:13px;word-break:break-all}
.app-menu,.theme-menu,.context-menu{position:fixed;z-index:650;min-width:230px;padding:8px;border-radius:16px;background:linear-gradient(180deg,var(--modal-1),var(--modal-2));box-shadow:0 30px 60px -20px rgba(0,0,0,.6),var(--rim-inset);display:none;flex-direction:column;gap:2px}
.app-menu.show,.theme-menu.show,.context-menu.show{display:flex}
.menu-item{width:100%;border:0;text-align:left;border-radius:10px;text-transform:uppercase}
.menu-item:hover{background:var(--accent-soft-12)}
.menu-item.danger:hover{color:var(--danger);background:color-mix(in srgb,var(--danger) 14%,transparent)}
.menu-divider{height:1px;margin:6px 4px;background:var(--input-border);opacity:.6}
.menu-row{display:grid;grid-template-columns:1fr 110px;align-items:center;gap:10px;padding:8px 12px;font-size:12px;color:var(--ink-dim);letter-spacing:.6px;text-transform:uppercase}
.menu-row input[type=range]{width:110px}
.menu-row input[type=number]{width:90px;padding:6px 8px;margin-top:0;border-radius:8px;background:var(--input-bg);border:1px solid var(--input-border);color:var(--ink);font:200 13px Inter,system-ui,sans-serif}
.menu-section-label{padding:8px 12px 2px;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--ink-dim);opacity:.75}
.theme-menu-header{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--ink-dim);padding:8px 10px 4px}
.theme-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;cursor:pointer;transition:.15s;color:var(--ink);font-size:13px}
.theme-item:hover,.theme-item.active{background:var(--accent-soft-12)}
.theme-swatch{width:24px;height:24px;border-radius:8px;flex-shrink:0;box-shadow:inset 0 1px 0 rgba(255,255,255,.2),inset 0 -1px 0 rgba(0,0,0,.2)}
.theme-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.theme-check{opacity:0;color:var(--accent)}
.theme-item.active .theme-check{opacity:1}
.theme-del{width:22px;height:22px;border-radius:6px;background:transparent;border:0;color:var(--ink-dim);cursor:pointer;opacity:0}
.theme-item:hover .theme-del{opacity:.8}
.theme-del:hover{opacity:1;color:var(--danger)}
.theme-import{padding:10px;border-radius:10px;background:transparent;border:1px dashed var(--input-border);color:var(--ink-dim);cursor:pointer;text-transform:uppercase}
.theme-import:hover{border-color:var(--accent);color:var(--ink-strong);background:var(--accent-soft-08)}
.gap-pop{position:fixed;z-index:660;display:none;flex-direction:column;gap:6px;padding:6px;border-radius:999px;background:linear-gradient(180deg,var(--modal-1),var(--modal-2));box-shadow:0 20px 40px -16px rgba(0,0,0,.6),var(--rim-inset)}
.gap-pop.show{display:flex}
.gap-btn{width:32px;height:32px;border-radius:50%;border:1px solid var(--input-border);background:transparent;color:var(--ink-dim);cursor:pointer;display:grid;place-items:center}
.gap-btn:hover{border-color:var(--accent);color:var(--ink-strong);background:var(--accent-soft-08)}
.gap-btn svg{width:16px;height:16px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--modal-1);color:var(--ink);border:1px solid var(--input-border);padding:10px 16px;border-radius:999px;font-size:13px;letter-spacing:.5px;z-index:700;opacity:0;pointer-events:none;transition:.2s;box-shadow:var(--shadow-card)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
@media(max-width:980px){body{overflow:auto}.app{height:auto;min-height:100vh}.toolbar{grid-template-columns:56px 1fr 56px}.pomo{grid-column:1/-1}.board{flex-direction:column;overflow-x:hidden;gap:8px}.column{flex:0 0 auto;max-width:none;min-height:55vh}.col-gap{display:none}.board-gap{display:none}}
</style>
</head>
<body>
<div class="app">
  <div class="toolbar">
    <div class="tool site-icon" id="siteIconBox" title="Click to set site/app icon (SVG)">
      <input type="file" id="siteIconInput" accept=".svg,image/svg+xml" hidden>
      <img id="siteIconImg" alt="Site icon">
      <svg id="siteIconPlaceholder" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      <button class="site-icon-remove" id="siteIconRemove" title="Remove icon">×</button>
    </div>
    <div class="tool title-tool"><input id="boardTitle" class="title-input" value="Untitled" maxlength="60" spellcheck="false"><span class="saved-dot" id="savedDot"></span></div>
    <div class="tool pomo" id="pomo" title="Drag to set time. Click once to type minutes manually.">
      <div class="pomo-fill" id="pomoFill"></div>
      <div class="pomo-inner"><div class="pomo-ticks" id="pomoTicks"></div><div class="pomo-state" id="pomoState">25:00</div></div>
    </div>
    <div class="tool menu-toggle" id="menuBtn" title="Menu"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></div>
  </div>
  <div class="app-menu" id="appMenu">
    <button class="menu-item" id="installBtn" hidden>Install App</button>
    <button class="menu-item" id="importBtn">Import Board JSON</button>
    <button class="menu-item" id="exportBtn">Export Board JSON</button>
    <button class="menu-item" id="saveBtn">Save Local</button>
    <div class="menu-divider"></div>
    <button class="menu-item" id="themeBtn">Themes</button>
    <button class="menu-item" id="exportThemeBtn">Export Current Theme</button>
    <div class="menu-divider"></div>
    <div class="menu-section-label">Pomodoro</div>
    <div class="menu-row"><span>Default (min)</span><input type="number" id="pomoDefaultInput" min="1" max="600" value="25"></div>
    <div class="menu-row"><span>Maximum (min)</span><input type="number" id="pomoMaxInput" min="1" max="600" value="25"></div>
    <div class="menu-divider"></div>
    <button class="menu-item" id="muteFab">Sound: On</button>
    <div class="menu-row"><span>SFX Volume</span><input type="range" id="sfxVolume" min="0" max="100" value="60"></div>
    <div class="menu-row"><span>Ticking Volume</span><input type="range" id="tickVolume" min="0" max="100" value="35"></div>
    <div class="menu-row"><span>Ring Volume</span><input type="range" id="ringVolume" min="0" max="100" value="70"></div>
    <div class="menu-divider"></div>
    <button class="menu-item danger" id="resetBtn">Reset</button>
  </div>
  <div class="theme-menu" id="themeMenu">
    <div class="theme-menu-header">Themes</div>
    <div id="themeList"></div>
    <div class="menu-divider"></div>
    <button class="theme-import" id="importThemeBtn">+ Import Theme (.json)</button>
  </div>
  <div class="boards-bar"><div class="boards-tabs" id="boardsTabs"></div><button class="board-add" id="newBoardBtn" title="New board">+</button></div>
  <section class="board" id="boardEl"></section>
</div>
<div class="context-menu" id="contextMenu"></div>
<div class="gap-pop" id="gapPop"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<input type="file" id="importThemeFile" accept="application/json,.json" hidden>

<div class="modal-back" id="editModal"><div class="modal"><h3 id="editModalTitle">New Task</h3>
  <input id="cardTitleInput" placeholder="Untitled task" autocomplete="off">
  <input id="cardLinkInput" type="url" placeholder="https://example.com optional" autocomplete="off">
  <textarea id="cardDescInput" placeholder="Add details. URLs become clickable."></textarea>
  <div class="modal-row"><button id="editDuplicateBtn" hidden>Duplicate</button><button id="editCancelBtn">Cancel</button><button class="primary" id="editSaveBtn">Save</button></div>
</div></div>

<div class="modal-back" id="viewModal"><div class="modal"><h3>Card</h3>
  <div class="view-title" id="viewTitle"></div>
  <a id="viewLinkBtn" class="view-link" target="_blank" rel="noopener noreferrer" style="display:none">🔗 <span id="viewLinkText"></span></a>
  <div class="desc-view" id="viewDesc"></div>
  <div class="modal-row"><button class="danger" id="viewDeleteBtn">Delete</button><button id="viewEditBtn">Edit</button><button class="primary" id="viewCloseBtn">Close</button></div>
</div></div>

<div class="modal-back" id="confirmModal"><div class="modal"><h3 id="confirmTitle">Are you sure?</h3>
  <div id="confirmText" style="color:var(--ink-dim);font-size:14px;margin-top:6px"></div>
  <div class="modal-row"><button id="confirmCancel">Cancel</button><button class="primary" id="confirmOk">Confirm</button></div>
</div></div>

<div class="modal-back" id="pomoInputModal"><div class="modal narrow"><h3>Set Pomodoro Timer</h3>
  <div style="font-size:12px;color:var(--ink-dim);margin-top:2px">Minutes (1–<span id="pomoInputMaxLabel">25</span>)</div>
  <input id="pomoMinutesInput" type="number" min="1" max="1500" value="25" autocomplete="off">
  <div class="modal-row"><button id="pomoInputCancel">Cancel</button><button class="primary" id="pomoInputStart">Start</button></div>
</div></div>

<div class="toast" id="toast"></div>
<script>
const STOCK_THEMES={
 'dark-blue':{name:'Dark Blue (Stock)',builtin:true,swatch:['#0e1a4a','#4aa3ff','#7ec0ff'],vars:{}},
 'light':{name:'Light',builtin:true,swatch:['#f6f8ff','#2f6ddf','#4f8df0'],vars:{

const STORAGE_KEY='kanban.v9';const TITLE_KEY='kanban.v9.title';const THEME_KEY='kanban.v9.theme';const CUSTOM_KEY='kanban.v9.customThemes';
const MUTE_KEY='kanban.v9.muted';const SFX_VOL_KEY='kanban.v9.sfxVol';const TICK_VOL_KEY='kanban.v9.tickVol';const RING_VOL_KEY='kanban.v9.ringVol';
const SITE_ICON_KEY='kanban.v9.siteIcon';const POMO_DEFAULT_KEY='kanban.v9.pomoDefaultMin';const POMO_MAX_KEY='kanban.v9.pomoMaxMin';

function rid(){return Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4)}
function defaultColumns(){return[{id:rid(),title:'To-Do',cards:[]},{id:rid(),title:'On-going',cards:[]},{id:rid(),title:'Done',cards:[]}]}
function newBoard(title){return{id:rid(),title:title||'Board',columns:defaultColumns()}}
function defaultState(){const b=newBoard('Board 1');return{boards:[b],activeBoardId:b.id}}
function normalizeCard(c){return{id:c.id||rid(),title:String(c.title||c.text||'Untitled'),link:String(c.link||''),description:String(c.description||'')}}
function migrateListsToColumns(lists){const map={todo:'To-Do',inprogress:'On-going',done:'Done'};return['todo','inprogress','done'].map(k=>({id:rid(),title:map[k],cards:(lists?.[k]||[]).map(normalizeCard)}))}
function loadState(){
  try{
    const raw=localStorage.getItem(STORAGE_KEY);
    if(!raw)return defaultState();
    const p=JSON.parse(raw);
    const boards=(p.boards||[]).map(b=>({id:b.id||rid(),title:b.title||'Board',
      columns:Array.isArray(b.columns)&&b.columns.length?b.columns.map(c=>({id:c.id||rid(),title:String(c.title||'Column'),cards:(c.cards||[]).map(normalizeCard)})):(b.lists?migrateListsToColumns(b.lists):defaultColumns())}));
    if(!boards.length)boards.push(newBoard('Board 1'));
    return{boards,activeBoardId:p.activeBoardId&&boards.find(b=>b.id===p.activeBoardId)?p.activeBoardId:boards[0].id};
  }catch{return defaultState()}
}

let state=loadState();
let boardTitle=localStorage.getItem(TITLE_KEY)||'Untitled';
let customThemes=loadCustomThemes();
let currentThemeId=localStorage.getItem(THEME_KEY)||'dark-blue';
let dirty=false;
let columnClipboard=null;
let boardClipboard=null;
let editContext=null;
let viewContext=null;
let confirmCb=null;
let muted=localStorage.getItem(MUTE_KEY)==='1';
let sfxVolume=numStore(SFX_VOL_KEY,.6),tickVolume=numStore(TICK_VOL_KEY,.35),ringVolume=numStore(RING_VOL_KEY,.7);
let pomoDefaultMin=intStore(POMO_DEFAULT_KEY,25);
let pomoMaxMin=intStore(POMO_MAX_KEY,25);

function numStore(key,fallback){const n=parseFloat(localStorage.getItem(key));return Number.isFinite(n)?Math.min(1,Math.max(0,n)):fallback}
function intStore(key,fallback){const n=parseInt(localStorage.getItem(key),10);return Number.isFinite(n)&&n>0?n:fallback}
function persist(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}
function activeBoard(){return state.boards.find(b=>b.id===state.activeBoardId)||state.boards[0]}
function findCol(id){return activeBoard().columns.find(c=>c.id===id)}
function markDirty(){dirty=true;savedDot.classList.add('dirty','show');persist()}
function markClean(){dirty=false;savedDot.classList.remove('dirty');savedDot.classList.add('show');setTimeout(()=>savedDot.classList.remove('show'),1200)}
function toast(msg){toastEl.textContent=msg;toastEl.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>toastEl.classList.remove('show'),1800)}

const metaTheme=document.getElementById('metaThemeColor'),titleInput=document.getElementById('boardTitle'),savedDot=document.getElementById('savedDot'),
boardsTabsEl=document.getElementById('boardsTabs'),boardEl=document.getElementById('boardEl'),contextMenu=document.getElementById('contextMenu'),
gapPop=document.getElementById('gapPop'),toastEl=document.getElementById('toast');

function loadCustomThemes(){try{return JSON.parse(localStorage.getItem(CUSTOM_KEY)||'{}')}catch{return{}}}
function persistCustomThemes(){localStorage.setItem(CUSTOM_KEY,JSON.stringify(customThemes))}
function getTheme(id){return STOCK_THEMES[id]||customThemes[id]||STOCK_THEMES['dark-blue']}
function applyTheme(id){
  currentThemeId=(STOCK_THEMES[id]||customThemes[id])?id:'dark-blue';
  const theme=getTheme(currentThemeId);
  const root=document.documentElement;
  ['--bg-grad','--ink','--ink-strong','--ink-dim','--accent','--accent-2','--danger','--warn','--link',
   '--panel-1','--panel-2','--panel-3','--card-1','--card-2','--tool-1','--tool-2','--modal-1','--modal-2',
   '--input-bg','--input-border','--hint','--shadow-strong','--shadow-card','--rim-inset','--rim-inset-card','--meta-theme'
  ].forEach(v=>root.style.removeProperty(v));
  Object.entries(theme.vars||{}).forEach(([k,v])=>root.style.setProperty(k,v));
  metaTheme.setAttribute('content',theme.vars?.['--meta-theme']||'#070d1f');
  localStorage.setItem(THEME_KEY,currentThemeId);
}
applyTheme(currentThemeId);

titleInput.value=boardTitle;document.title=boardTitle+' — Kanban';
titleInput.addEventListener('input',()=>{boardTitle=titleInput.value||'Untitled';localStorage.setItem(TITLE_KEY,boardTitle);document.title=boardTitle+' — Kanban';markDirty()});
titleInput.addEventListener('blur',()=>{if(!titleInput.value.trim())titleInput.value='Untitled'});

function svgIcon(kind){
  const icons={
    add:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
    paste:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4h6l1 2h3v15H5V6h3l1-2Z"/><path d="M9 10h6M9 14h6"/></svg>'
  };
  return icons[kind];
}

/* ---------- Gap popovers (right-click only) ---------- */
function closeGapPop(){gapPop.classList.remove('show');gapPop.innerHTML=''}
function openGapPop(e,type,index){
  e.preventDefault();e.stopPropagation();
  closeContext();
  gapPop.innerHTML='';
  const clip = type==='board' ? boardClipboard : columnClipboard;
  if(clip){
    const paste=document.createElement('button');paste.className='gap-btn';paste.title=type==='board'?'Paste board here':'Paste column here';paste.innerHTML=svgIcon('paste');
    paste.addEventListener('click',ev=>{ev.stopPropagation();closeGapPop();type==='board'?pasteBoardAt(index):pasteColumnAt(index)});
    gapPop.appendChild(paste);
  }
  const add=document.createElement('button');add.className='gap-btn';add.title=type==='board'?'Add board here':'Add column here';add.innerHTML=svgIcon('add');
  add.addEventListener('click',ev=>{ev.stopPropagation();closeGapPop();type==='board'?addBoardAt(index):addColumnAt(index)});
  gapPop.appendChild(add);
  gapPop.classList.add('show');
  const w=76,h=clip?84:46;
  gapPop.style.left=Math.min(e.clientX-16,window.innerWidth-w)+'px';
  gapPop.style.top=Math.min(e.clientY-16,window.innerHeight-h)+'px';
}
document.addEventListener('click',e=>{if(!gapPop.contains(e.target))closeGapPop()});
document.addEventListener('scroll',closeGapPop,true);

function makeGap(type,index){
  const gap=document.createElement('div');
  gap.className=type==='board'?'board-gap':'col-gap';
  gap.addEventListener('contextmenu',e=>openGapPop(e,type,index));
  return gap;
}

/* ---------- Boards ---------- */
function renderBoardsTabs(){
  boardsTabsEl.innerHTML='';
  boardsTabsEl.appendChild(makeGap('board',0));
  state.boards.forEach((b,i)=>{
    boardsTabsEl.appendChild(renderBoardTab(b));
    boardsTabsEl.appendChild(makeGap('board',i+1));
  });
}
function renderBoardTab(b){
  const el=document.createElement('div');
  el.className='board-tab'+(b.id===state.activeBoardId?' active':'');
  el.dataset.id=b.id;
  el.title='Click to switch • Double-click to rename • Right-click to copy/paste • Drag to reorder';
  const name=document.createElement('span');name.className='board-tab-name';name.textContent=b.title||'Untitled';
  const close=document.createElement('button');close.className='board-tab-close';close.textContent='✕';close.title='Delete board';
  el.append(name,close);
  el.addEventListener('click',()=>{if(name.isContentEditable)return;state.activeBoardId=b.id;persist();renderBoardsTabs();renderActiveBoard()});
  el.addEventListener('contextmenu',e=>openBoardContext(e,b));
  close.addEventListener('click',e=>{
    e.stopPropagation();
    confirmDialog('Delete this board?',`"${b.title}" and all its columns will be removed.`,()=>{
      const idx=state.boards.findIndex(x=>x.id===b.id);
      state.boards.splice(idx,1);
      if(!state.boards.length)state.boards.push(newBoard('Board 1'));
      if(state.activeBoardId===b.id)state.activeBoardId=state.boards[Math.max(0,idx-1)].id;
      markDirty();renderBoardsTabs();renderActiveBoard();toast('Board deleted');
    });
  });
  name.addEventListener('dblclick',e=>{e.stopPropagation();name.contentEditable='true';name.focus();selectNode(name)});
  name.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();name.blur()}else if(e.key==='Escape'){name.textContent=b.title;name.blur()}});
  name.addEventListener('blur',()=>{if(name.isContentEditable){name.contentEditable='false';const v=name.textContent.trim();if(v&&v!==b.title){b.title=v;markDirty()}else name.textContent=b.title}});
  el.draggable=true;
  el.addEventListener('dragstart',e=>{el.classList.add('dragging-tab');e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('application/x-board',b.id);sfx.pluck()});
  el.addEventListener('dragend',()=>el.classList.remove('dragging-tab'));
  el.addEventListener('dragover',e=>{if(e.dataTransfer.types.includes('application/x-board'))e.preventDefault()});
  el.addEventListener('drop',e=>{e.preventDefault();const fromId=e.dataTransfer.getData('application/x-board');if(!fromId||fromId===b.id)return;moveBoardBefore(fromId,b.id)});
  return el;
}
function moveBoardBefore(fromId,toId){
  const fromIdx=state.boards.findIndex(x=>x.id===fromId),toIdx=state.boards.findIndex(x=>x.id===toId);
  if(fromIdx<0||toIdx<0)return;
  const[m]=state.boards.splice(fromIdx,1);state.boards.splice(toIdx,0,m);
  markDirty();renderBoardsTabs();sfx.pop();
}
function addBoardAt(index){
  const b=newBoard('Board '+(state.boards.length+1));
  state.boards.splice(index,0,b);state.activeBoardId=b.id;
  markDirty();renderBoardsTabs();renderActiveBoard();toast('Board added');
}
function cloneBoard(b){
  const copy=JSON.parse(JSON.stringify(b));
  copy.id=rid();copy.title=(copy.title||'Board')+' Copy';
  copy.columns=(copy.columns||[]).map(c=>({id:rid(),title:c.title,cards:(c.cards||[]).map(card=>({...card,id:rid()}))}));
  return copy;
}
function copyBoard(b){boardClipboard=JSON.parse(JSON.stringify(b));toast(`Copied board: ${b.title}`)}
function pasteBoardAt(index){
  if(!boardClipboard)return;
  const b=cloneBoard(boardClipboard);
  state.boards.splice(index,0,b);state.activeBoardId=b.id;
  markDirty();renderBoardsTabs();renderActiveBoard();toast('Board pasted');
}
function openBoardContext(e,b){
  e.preventDefault();closeGapPop();
  contextMenu.innerHTML='';
  menuBtnOf('Copy board',()=>copyBoard(b));
  if(boardClipboard){const idx=state.boards.findIndex(x=>x.id===b.id);menuBtnOf('Paste board after this',()=>pasteBoardAt(idx+1))}
  menuDivider();
  menuBtnOf('Duplicate board',()=>{copyBoard(b);const idx=state.boards.findIndex(x=>x.id===b.id);pasteBoardAt(idx+1)});
  showContext(e);
}

/* ---------- Columns ---------- */
function renderActiveBoard(){
  const b=activeBoard();
  boardEl.innerHTML='';
  boardEl.appendChild(makeGap('col',0));
  b.columns.forEach((col,i)=>{
    boardEl.appendChild(renderColumn(col));
    boardEl.appendChild(makeGap('col',i+1));
  });
  persist();
}
function addColumnAt(index){
  const col={id:rid(),title:'New Column',cards:[]};
  activeBoard().columns.splice(index,0,col);
  markDirty();renderActiveBoard();
  requestAnimationFrame(()=>{
    const el=boardEl.querySelector(`.column[data-col-id="${col.id}"] .col-title`);
    if(el){el.contentEditable='true';el.focus();selectNode(el);el.scrollIntoView({behavior:'smooth',inline:'center'})}
  });
}
function cloneColumn(col){return{id:rid(),title:(col.title||'Column')+' Copy',cards:(col.cards||[]).map(c=>({...c,id:rid()}))}}
function copyColumn(col){columnClipboard=JSON.parse(JSON.stringify(col));toast(`Copied column: ${col.title}`)}
function pasteColumnAt(index){
  if(!columnClipboard)return;
  activeBoard().columns.splice(index,0,cloneColumn(columnClipboard));
  markDirty();renderActiveBoard();toast('Column pasted');
}
function copyColumnToBoard(col,boardId){
  const target=state.boards.find(b=>b.id===boardId);if(!target)return;
  target.columns.push(cloneColumn(col));
  markDirty();if(target.id===state.activeBoardId)renderActiveBoard();toast(`Copied to ${target.title}`);
}
function openColumnContext(e,col){
  e.preventDefault();closeGapPop();
  contextMenu.innerHTML='';
  menuBtnOf('Copy column',()=>copyColumn(col));
  if(columnClipboard){const idx=activeBoard().columns.findIndex(c=>c.id===col.id);menuBtnOf('Paste column after this',()=>pasteColumnAt(idx+1))}
  menuDivider();
  state.boards.filter(b=>b.id!==activeBoard().id).forEach(b=>menuBtnOf('Copy to: '+b.title,()=>copyColumnToBoard(col,b.id)));
  showContext(e);
}
function menuBtnOf(label,fn){const btn=document.createElement('button');btn.className='menu-item';btn.textContent=label;btn.addEventListener('click',()=>{closeContext();fn()});contextMenu.appendChild(btn)}
function menuDivider(){const d=document.createElement('div');d.className='menu-divider';contextMenu.appendChild(d)}
function showContext(e){contextMenu.classList.add('show');contextMenu.style.left=Math.min(e.clientX,window.innerWidth-260)+'px';contextMenu.style.top=Math.min(e.clientY,window.innerHeight-300)+'px'}
function closeContext(){contextMenu.classList.remove('show')}

function renderColumn(col){
  const section=document.createElement('section');section.className='column';section.dataset.colId=col.id;
  section.addEventListener('contextmenu',e=>openColumnContext(e,col));
  const head=document.createElement('div');head.className='col-head';head.draggable=true;
  const title=document.createElement('div');title.className='col-title';title.textContent=col.title;title.title='Double-click to rename • Right-click for copy menu';
  const count=document.createElement('div');count.className='col-count';count.textContent=col.cards.length;
  const del=document.createElement('button');del.className='col-del';del.textContent='✕';del.title='Delete column';
  head.append(title,count,del);
  title.addEventListener('dblclick',e=>{e.stopPropagation();head.draggable=false;title.contentEditable='true';title.focus();selectNode(title)});
  title.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();title.blur()}else if(e.key==='Escape'){title.textContent=col.title;title.blur()}});
  title.addEventListener('blur',()=>{if(title.isContentEditable){title.contentEditable='false';head.draggable=true;const v=title.textContent.trim();if(v&&v!==col.title){col.title=v;markDirty()}else title.textContent=col.title}});
  del.addEventListener('click',e=>{
    e.stopPropagation();
    confirmDialog('Delete this column?',`"${col.title}" contains ${col.cards.length} card(s).`,()=>{
      activeBoard().columns=activeBoard().columns.filter(c=>c.id!==col.id);
      markDirty();renderActiveBoard();toast('Column deleted');
    });
  });
  head.addEventListener('dragstart',e=>{
    if(title.isContentEditable){e.preventDefault();return}
    section.classList.add('col-dragging');e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('application/x-column',col.id);sfx.pluck();
  });
  head.addEventListener('dragend',()=>{section.classList.remove('col-dragging');document.querySelectorAll('.col-drop-target').forEach(el=>el.classList.remove('col-drop-target'))});
  section.addEventListener('dragover',e=>{if(e.dataTransfer.types.includes('application/x-column')){e.preventDefault();section.classList.add('col-drop-target')}});
  section.addEventListener('dragleave',e=>{if(!section.contains(e.relatedTarget))section.classList.remove('col-drop-target')});
  section.addEventListener('drop',e=>{
    if(!e.dataTransfer.types.includes('application/x-column'))return;
    e.preventDefault();section.classList.remove('col-drop-target');
    const fromId=e.dataTransfer.getData('application/x-column');if(!fromId||fromId===col.id)return;
    const b=activeBoard();const fromIdx=b.columns.findIndex(c=>c.id===fromId),toIdx=b.columns.findIndex(c=>c.id===col.id);
    const[moved]=b.columns.splice(fromIdx,1);b.columns.splice(toIdx,0,moved);
    markDirty();renderActiveBoard();sfx.pop();
  });
  const addCard=document.createElement('button');addCard.className='add-btn';addCard.textContent='+  Add a task';addCard.onclick=()=>openAddModal(col.id);
  const list=document.createElement('div');list.className='list';list.dataset.colId=col.id;
  col.cards.forEach(card=>list.appendChild(renderCard(card,col.id)));
  section.append(head,addCard,list);
  return section;
}

function firstUrlIn(text){const m=String(text||'').match(/(https?:\/\/[^\s<>"']+)/i);return m?m[1]:''}
function isValidUrl(s){try{const u=new URL(s);return u.protocol==='http:'||u.protocol==='https:'}catch{return false}}
function renderCard(card,colId){
  const el=document.createElement('div');el.className='card';el.dataset.id=card.id;el.dataset.colId=colId;
  const text=document.createElement('span');text.className='text';
  if(card.description&&card.description.trim()){const dot=document.createElement('span');dot.className='has-desc';text.appendChild(dot)}
  text.appendChild(document.createTextNode(card.title));el.appendChild(text);
  const effective=(card.link&&isValidUrl(card.link))?card.link:firstUrlIn(card.description);
  if(effective&&isValidUrl(effective)){
    const link=document.createElement('button');link.className='icon-btn link';link.textContent='↗';
    link.onclick=e=>{e.stopPropagation();window.open(effective,'_blank','noopener,noreferrer')};
    link.addEventListener('pointerdown',e=>e.stopPropagation());el.appendChild(link);
  }
  const edit=document.createElement('button');edit.className='icon-btn edit';edit.textContent='✎';
  edit.onclick=e=>{e.stopPropagation();openEditModal(colId,card.id)};edit.addEventListener('pointerdown',e=>e.stopPropagation());
  const del=document.createElement('button');del.className='icon-btn del';del.textContent='✕';
  del.onclick=e=>{e.stopPropagation();confirmDialog('Delete card?',`"${card.title}" will be removed.`,()=>{const col=findCol(colId);if(col){col.cards=col.cards.filter(c=>c.id!==card.id);markDirty();renderActiveBoard()}})};
  del.addEventListener('pointerdown',e=>e.stopPropagation());
  el.append(edit,del);
  el.addEventListener('click',()=>{if(el.dataset.suppressClick==='1'){el.dataset.suppressClick='';return}openViewModal(colId,card.id)});
  el.addEventListener('pointerdown',onCardPointerDown);
  return el;
}

function openAddModal(colId){
  editContext={mode:'add',colId};editModalTitle.textContent='New Task';
  cardTitleInput.value='';cardLinkInput.value='';cardDescInput.value='';editDuplicateBtn.hidden=true;
  showModal(editModal);setTimeout(()=>cardTitleInput.focus(),30);
}
function openEditModal(colId,id){
  const col=findCol(colId),card=col?.cards.find(c=>c.id===id);if(!card)return;
  editContext={mode:'edit',colId,id};editModalTitle.textContent='Edit Task';
  cardTitleInput.value=card.title||'';cardLinkInput.value=card.link||'';cardDescInput.value=card.description||'';editDuplicateBtn.hidden=false;
  showModal(editModal);setTimeout(()=>cardTitleInput.focus(),30);
}
function saveEdit(){
  if(!editContext)return;
  const title=cardTitleInput.value.trim(),link=cardLinkInput.value.trim(),description=cardDescInput.value;
  if(!title)return toast('Add a title first');
  if(link&&!isValidUrl(link))return toast('Link must start with http:// or https://');
  const col=findCol(editContext.colId);if(!col)return hideModal(editModal);
  if(editContext.mode==='add')col.cards.push({id:rid(),title,link,description});

/* ---------- Card drag/drop ---------- */
let drag=null;
function onCardPointerDown(e){
  if(e.button!==undefined&&e.button!==0)return;
  if(e.target.closest('.icon-btn'))return;
  const cardEl=e.currentTarget,pointerId=e.pointerId,startX=e.clientX,startY=e.clientY,rect=cardEl.getBoundingClientRect();
  const ctx={offsetX:startX-rect.left,offsetY:startY-rect.top,fromColId:cardEl.dataset.colId,cardId:cardEl.dataset.id};
  let started=false;
  try{cardEl.setPointerCapture(pointerId)}catch{}
  function onMove(ev){
    if(ev.pointerId!==pointerId)return;
    if(!started){const dx=ev.clientX-startX,dy=ev.clientY-startY;if(dx*dx+dy*dy<36)return;started=true;beginDrag(cardEl,ev,ctx)}
    if(started){ev.preventDefault();onDragMove(ev)}
  }
  function onUp(ev){
    if(ev.pointerId!==pointerId)return;
    document.removeEventListener('pointermove',onMove);document.removeEventListener('pointerup',onUp);document.removeEventListener('pointercancel',onUp);
    try{cardEl.releasePointerCapture(pointerId)}catch{}
    if(started){cardEl.dataset.suppressClick='1';onDragEnd()}
  }
  document.addEventListener('pointermove',onMove,{passive:false});
  document.addEventListener('pointerup',onUp);document.addEventListener('pointercancel',onUp);
}
function beginDrag(cardEl,ev,ctx){
  const rect=cardEl.getBoundingClientRect();
  const ghost=cardEl.cloneNode(true);ghost.classList.add('drag-ghost');ghost.style.width=rect.width+'px';ghost.style.height=rect.height+'px';
  document.body.appendChild(ghost);
  const ph=document.createElement('div');ph.className='drag-placeholder';ph.style.height=rect.height+'px';
  cardEl.parentNode.insertBefore(ph,cardEl);
  cardEl.classList.add('dragging-source');
  drag={cardEl,ghost,placeholder:ph,...ctx,targetColId:ctx.fromColId};
  positionGhost(ev.clientX,ev.clientY);sfx.pluck();
}
function positionGhost(x,y){if(!drag)return;drag.ghost.style.transform=`translate(${x-drag.offsetX}px, ${y-drag.offsetY}px) rotate(-2deg) scale(1.04)`}
function onDragMove(ev){
  if(!drag)return;positionGhost(ev.clientX,ev.clientY);
  let targetList=null;
  for(const l of document.querySelectorAll('.list')){
    const r=l.getBoundingClientRect();
    if(ev.clientX>=r.left&&ev.clientX<=r.right&&ev.clientY>=r.top-24&&ev.clientY<=r.bottom+24){targetList=l;break}
  }
  if(!targetList)return;
  const cards=[...targetList.querySelectorAll('.card:not(.dragging-source)')];
  let before=null;
  for(const c of cards){const r=c.getBoundingClientRect();if(ev.clientY<r.top+r.height/2){before=c;break}}
  if(before)targetList.insertBefore(drag.placeholder,before);else targetList.appendChild(drag.placeholder);
  drag.targetColId=targetList.dataset.colId;
}
function onDragEnd(){
  if(!drag)return;
  const b=activeBoard(),fromCol=b.columns.find(c=>c.id===drag.fromColId);
  if(!fromCol)return cleanupDrag();
  const srcIdx=fromCol.cards.findIndex(c=>c.id===drag.cardId);if(srcIdx<0)return cleanupDrag();
  const[card]=fromCol.cards.splice(srcIdx,1);
  const targetCol=b.columns.find(c=>c.id===drag.targetColId)||fromCol;
  const list=document.querySelector(`.list[data-col-id="${targetCol.id}"]`);
  const dropAt=[...list.children].indexOf(drag.placeholder);
  targetCol.cards.splice(dropAt>=0?dropAt:targetCol.cards.length,0,card);
  cleanupDrag();markDirty();renderActiveBoard();sfx.pop();
}
function cleanupDrag(){if(!drag)return;drag.ghost.remove();drag.placeholder.remove();drag.cardEl.classList.remove('dragging-source');drag=null}

/* ---------- Audio ---------- */
const audio=(()=>{
  let ctx,tickTimer=null,ringTimer=null;
  function ensure(){if(muted)return null;if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();return ctx}
  function tone(freq=440,end=220,dur=.08,vol=.06,type='triangle'){
    const ac=ensure();if(!ac||vol<=0)return;
    const now=ac.currentTime,osc=ac.createOscillator(),g=ac.createGain();
    osc.type=type;osc.frequency.setValueAtTime(freq,now);osc.frequency.exponentialRampToValueAtTime(Math.max(1,end),now+dur);
    g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(vol,now+.005);g.gain.exponentialRampToValueAtTime(.0001,now+dur);
    osc.connect(g).connect(ac.destination);osc.start(now);osc.stop(now+dur+.02);
  }
  function tick(){tone(1050,650,.035,.13*tickVolume,'square')}
  function ring(){tone(880,880,.16,.18*ringVolume,'sine');setTimeout(()=>tone(1175,1175,.18,.14*ringVolume,'sine'),190)}
  return{
    tone,tick,
    startTicking(){this.stopTicking();if(muted||tickVolume<=0)return;tick();tickTimer=setInterval(tick,1000)},
    stopTicking(){clearInterval(tickTimer);tickTimer=null},
    startRinging(){this.stopRinging();if(muted||ringVolume<=0)return;ring();ringTimer=setInterval(ring,650)},
    stopRinging(){clearInterval(ringTimer);ringTimer=null}
  };
})();
const sfx={
  click(){audio.tone(880,520,.07,.05*sfxVolume)},
  pluck(){audio.tone(660,330,.16,.12*sfxVolume)},
  pop(){audio.tone(220,90,.15,.14*sfxVolume,'sine')}
};

/* ---------- Pomodoro ---------- */
const pomo=document.getElementById('pomo'),pomoState=document.getElementById('pomoState'),pomoFill=document.getElementById('pomoFill'),pomoTicks=document.getElementById('pomoTicks');
let pomoTotal=pomoDefaultMin*60,pomoLeft=pomoDefaultMin*60,pomoTimer=null,pomoRinging=false,lastTickSound=0;

function renderPomoTicks(){
  pomoTicks.innerHTML='';
  const totalTicks=Math.max(1,pomoMaxMin);
  for(let i=1;i<=totalTicks;i++){
    const t=document.createElement('span');
    t.className='pomo-tick'+(i%5===0?' major':'');
    t.title=`${i} minute${i===1?'':'s'}`;
    pomoTicks.appendChild(t);
  }
}
renderPomoTicks();

function fmt(sec){sec=Math.max(0,Math.round(sec));return String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')}
function updatePomo(){
  if(pomoRinging){pomoState.textContent='RESET TIMER'}else pomoState.textContent=fmt(pomoLeft);
  pomoFill.style.width=(pomoTotal?((pomoTotal-pomoLeft)/pomoTotal*100):0)+'%';
  const activeMin=Math.ceil((pomoTotal-pomoLeft)/60);
  [...pomoTicks.children].forEach((t,i)=>t.classList.toggle('active',i<activeMin));
}
function stopPomo(){clearInterval(pomoTimer);pomoTimer=null;pomo.classList.remove('running');audio.stopTicking()}
function resetPomo(){
  stopPomo();audio.stopRinging();pomoRinging=false;pomo.classList.remove('ringing');
  pomoTotal=pomoDefaultMin*60;pomoLeft=pomoTotal;updatePomo();
}
function startPomo(seconds){
  audio.stopRinging();pomoRinging=false;pomo.classList.remove('ringing');stopPomo();
  const maxSec=pomoMaxMin*60;
  pomoTotal=Math.max(1,Math.min(maxSec,Math.round(seconds)));pomoLeft=pomoTotal;updatePomo();
  pomo.classList.add('running');audio.startTicking();
  pomoTimer=setInterval(()=>{
    pomoLeft-=1;updatePomo();
    if(pomoLeft<=0){
      stopPomo();pomoLeft=0;pomoRinging=true;pomo.classList.add('ringing');updatePomo();
      audio.startRinging();toast('Pomodoro complete');
    }
  },1000);
}
function secondsFromX(x){
  const r=pomo.getBoundingClientRect();
  const p=Math.max(0,Math.min(1,(x-r.left)/r.width));
  const maxSec=pomoMaxMin*60;
  return Math.max(1,Math.round(1+p*(maxSec-1)));
}
function openPomoInput(){
  pomoInputMaxLabel.textContent=pomoMaxMin;
  pomoMinutesInput.max=pomoMaxMin;
  pomoMinutesInput.value=Math.max(1,Math.min(pomoMaxMin,Math.round(pomoTotal/60)))||pomoDefaultMin;
  showModal(pomoInputModal);
  setTimeout(()=>{pomoMinutesInput.focus();pomoMinutesInput.select()},30);
}
pomoInputCancel.onclick=()=>hideModal(pomoInputModal);
pomoInputStart.onclick=()=>{
  let m=parseInt(pomoMinutesInput.value,10);
  if(!Number.isFinite(m)||m<1)m=1;
  if(m>pomoMaxMin)m=pomoMaxMin;
  hideModal(pomoInputModal);
  startPomo(m*60);
};
pomoMinutesInput.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();pomoInputStart.click()}});

let pomoDown=null;
pomo.addEventListener('pointerdown',e=>{
  if(pomoRinging){resetPomo();return}
  pomoDown={startX:e.clientX,moved:false,pointerId:e.pointerId};
  try{pomo.setPointerCapture(e.pointerId)}catch{}
  e.preventDefault();
});
pomo.addEventListener('pointermove',e=>{
  if(!pomoDown||e.pointerId!==pomoDown.pointerId)return;
  if(!pomoDown.moved){
    if(Math.abs(e.clientX-pomoDown.startX)<5)return;
    pomoDown.moved=true;stopPomo();
  }
  if(pomoDown.moved){
    pomoTotal=secondsFromX(e.clientX);pomoLeft=pomoTotal;updatePomo();
    const now=Date.now();
    if(now-lastTickSound>45){lastTickSound=now;sfx.click()}
  }
});
function endPomoPointer(e){
  if(!pomoDown||(e.pointerId!==undefined&&e.pointerId!==pomoDown.pointerId))return;
  try{pomo.releasePointerCapture(pomoDown.pointerId)}catch{}
  const wasMoved=pomoDown.moved;pomoDown=null;
  if(wasMoved)startPomo(pomoTotal);else openPomoInput();
}
pomo.addEventListener('pointerup',endPomoPointer);
pomo.addEventListener('pointercancel',endPomoPointer);
updatePomo();

function buildManifest(iconHref){
  const manifest={name:'Kanban',short_name:'Kanban',start_url:'.',scope:'.',display:'standalone',
    background_color:'#070d1f',theme_color:metaTheme.getAttribute('content')||'#070d1f',description:'A themeable multi-board Kanban PWA.',
    icons:[192,512].map(size=>({src:iconHref||DEFAULT_LOGO_URI,sizes:`${size}x${size}`,type:'image/svg+xml',purpose:'any maskable'}))};
  let link=document.getElementById('manifestLink');
  if(!link){link=document.createElement('link');link.id='manifestLink';link.rel='manifest';document.head.appendChild(link)}
  const blob=new Blob([JSON.stringify(manifest)],{type:'application/manifest+json'});
  if(link.href)URL.revokeObjectURL(link.href);
  link.href=URL.createObjectURL(blob);
}
function applySiteIcon(dataUri){
  if(dataUri){siteIconImg.src=dataUri;siteIconImg.style.display='block';siteIconBox.classList.add('has-icon')}
  else{siteIconImg.removeAttribute('src');siteIconImg.style.display='none';siteIconBox.classList.remove('has-icon')}
  setFavicon(dataUri);buildManifest(dataUri);
}
const storedIcon=localStorage.getItem(SITE_ICON_KEY);
applySiteIcon(storedIcon==='none'?null:(storedIcon||DEFAULT_LOGO_URI));
siteIconBox.onclick=e=>{if(e.target===siteIconRemove)return;siteIconInput.click()};
siteIconRemove.onclick=e=>{e.stopPropagation();localStorage.setItem(SITE_ICON_KEY,'none');applySiteIcon(null);toast('Icon removed')};
siteIconInput.onchange=()=>{
  const file=siteIconInput.files&&siteIconInput.files[0];siteIconInput.value='';if(!file)return;
  if(file.type!=='image/svg+xml'&&!/\.svg$/i.test(file.name))return toast('Please choose an SVG file');
  const reader=new FileReader();
  reader.onload=()=>{
    const text=String(reader.result||'');
    if(!/<svg[\s>]/i.test(text))return toast("That file doesn't look like SVG");
    const uri='data:image/svg+xml;utf8,'+encodeURIComponent(text);
    localStorage.setItem(SITE_ICON_KEY,uri);applySiteIcon(uri);toast('Icon updated');
  };
  reader.readAsText(file);
};

/* ---------- PWA install / service worker ---------- */
const installBtn=document.getElementById('installBtn');
let deferredInstallPrompt=null;
const isStandalone=()=>window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;
function updateInstallVisibility(){installBtn.hidden=!deferredInstallPrompt||isStandalone()}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstallPrompt=e;updateInstallVisibility()});
installBtn.onclick=async()=>{
  closeAppMenu();
  if(!deferredInstallPrompt){toast(isStandalone()?'Already installed':'Install not available in this browser');return}
  deferredInstallPrompt.prompt();
  const{outcome}=await deferredInstallPrompt.userChoice;
  deferredInstallPrompt=null;updateInstallVisibility();
  toast(outcome==='accepted'?'Installing...':'Install dismissed');
};
window.addEventListener('appinstalled',()=>{deferredInstallPrompt=null;updateInstallVisibility();toast('Installed for offline use')});
updateInstallVisibility();
if('serviceWorker' in navigator){
  const swCode=`const CACHE='kanban-v9';self.addEventListener('install',e=>self.skipWaiting());self.addEventListener('activate',e=>e.waitUntil(caches.keys().then(keys=>Promise.all(keys.filter(k=>k!==CACHE).map(k=>caches.delete(k)))).then(()=>self.clients.claim())));self.addEventListener('fetch',e=>{if(e.request.method!=='GET')return;e.respondWith(caches.open(CACHE).then(async cache=>{const cached=await cache.match(e.request);try{const res=await fetch(e.request);if(res&&res.ok)cache.put(e.request,res.clone());return res}catch{return cached||Response.error()}}))});`;
  const blob=new Blob([swCode],{type:'application/javascript'});
  navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(()=>{});
}

/* ---------- Utility / boot ---------- */
function selectNode(node){const range=document.createRange();range.selectNodeContents(node);const sel=window.getSelection();sel.removeAllRanges();sel.addRange(range)}
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){document.querySelectorAll('.modal-back.show').forEach(hideModal);closeAppMenu();closeThemeMenu();closeContext();closeGapPop()}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();persist();markClean();toast('Saved locally')}
});
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});

renderBoardsTabs();renderActiveBoard();markClean();
</script>
